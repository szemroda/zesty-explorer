name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      version:
        description: Version written into package.json before packing
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set the release version
        if: inputs.version
        run: npm pkg set version="$VERSION"
        env:
          VERSION: ${{ inputs.version }}
      - run: pnpm check
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      # Performance budgets are calibrated on a developer machine, so they run locally only.
      - run: pnpm exec playwright test --project=chromium-laptop --project=chromium-desktop
      - run: pnpm pack --pack-destination artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: artifacts/*.tgz
          if-no-files-found: error

  # Runs the packed CLI the way npx users do, on the oldest supported Node.js.
  smoke:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifacts
      - name: Start the packed CLI and load the app
        shell: bash
        run: |
          package="$PWD/$(ls artifacts/*.tgz)"
          npm exec --yes --package="$package" -- zestyx --no-open > zestyx.log 2>&1 &
          for attempt in $(seq 30); do
            curl -fsS -o /dev/null http://localhost:5173/ && break
            sleep 1
          done
          cat zestyx.log
          asset=$(curl -fsS http://localhost:5173/ | grep -o '/assets/[^"]*\.js' | head -n 1)
          curl -fsS -o /dev/null "http://localhost:5173$asset"
